{{ if .Site.Params.comments }}
<div>
    <div class="pagination__title">
        <span class="pagination__title-h" style="font-size: 20px;">评论</span>
        <hr />
    </div>
    <div id="tcomment"></div>
    <script src="{{ "js/twikoo/1.6.31/twikoo.all.min.js" | relURL }}"></script>
    <script>
        twikoo.init({
            envId: "{{ .Site.Params.twikoo_envId }}",
            el: "#tcomment",
            lang: 'zh-CN',
            path: window.TWIKOO_MAGIC_PATH||window.location.pathname,
        });
    </script>
</div>
{{ end }}
