<script src="/js/quicklink/0.1.1/quicklink.umd.js"></script>
{{ if and .Site.Params.lazyImage (not .IsHome) -}}
<script src="{{ .Site.Params.staticPrefix }}{{ "/js/lazyload.min.js" | relURL }}"></script>
<script>
  var lazyImage = new LazyLoad({
    container: document.getElementById('article')
  });
</script>
{{ end }}
<script>
   var posts = document.getElementById('posts-list');
   posts && quicklink({
     el: posts,
     priority: true,
   });
  
</script>

<!-- GLightbox 灯箱 -->
<script src="https://cdn.jsdelivr.net/npm/glightbox@3.3.0/dist/js/glightbox.min.js"></script>
<script>
  if (typeof GLightbox !== 'undefined') {
    GLightbox({
      selector: '.markdown-body img, .entry-content img',
      touchNavigation: true,
      loop: true,
      draggable: true,
    });
  }
</script>
